spring.application.name=trustgate

# =========================================================
# External configuration
# =========================================================
# Loads Backend/.env when present.
# The file is optional and should remain git-ignored.
spring.config.import=optional:file:.env[.properties]


# =========================================================
# PostgreSQL
# =========================================================
# Production:
#   DATABASE_URL is provided by the cloud PostgreSQL service.
#
# Local:
#   Falls back to the local PostgreSQL instance.
#
# NOTE:
# Depending on the cloud provider, DATABASE_URL may be a full
# JDBC URL. If your provider exposes host/port/db separately,
# configure the corresponding environment variables instead.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/trustgate}

spring.datasource.username=${DB_USERNAME:ak}

spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false


# =========================================================
# Server
# =========================================================
# Railway / other platforms may inject PORT dynamically.
# Local development continues to use 8080.
server.port=${PORT:8080}


# =========================================================
# JWT
# =========================================================
# IMPORTANT:
# - HS256 requires a sufficiently long secret.
# - Use JWT_SECRET in production.
# - Never commit the production secret to Git.
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789abcdef}


# =========================================================
# Gemini
# =========================================================
# Spring AI Google GenAI configuration.
#
# GOOGLE_API_KEY should be supplied as an environment variable
# in production.
#
# Non-empty defaults are retained because the Spring AI GenAI
# auto-configuration expects project/location values to exist
# even when using API-key mode.
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:unset-google-api-key}

spring.ai.google.genai.project-id=${GOOGLE_PROJECT_ID:controlplane-demo}

spring.ai.google.genai.location=${GOOGLE_LOCATION:global}


# =========================================================
# Gemini Embeddings
# =========================================================
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY:unset-google-api-key}

spring.ai.google.genai.embedding.project-id=${GOOGLE_PROJECT_ID:controlplane-demo}

spring.ai.google.genai.embedding.location=${GOOGLE_LOCATION:global}

spring.ai.google.genai.embedding.text.options.model=gemini-embedding-2

spring.ai.google.genai.embedding.text.options.task-type=RETRIEVAL_DOCUMENT

spring.ai.google.genai.embedding.text.options.dimensions=768


# =========================================================
# PGVector
# =========================================================
spring.ai.vectorstore.pgvector.initialize-schema=true

spring.ai.vectorstore.pgvector.index-type=HNSW

spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

spring.ai.vectorstore.pgvector.dimensions=768

spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE


# =========================================================
# Logging
# =========================================================
logging.level.org.springframework.security=INFO