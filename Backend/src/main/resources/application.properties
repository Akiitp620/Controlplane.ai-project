spring.application.name=trustgate

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/trustgate
spring.datasource.username=postgres
spring.datasource.password=REMOVED_SECRET
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT
jwt.secret=trustgate-jwt-secret-2026-my-secret-key-123456

# Gemini
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}

# Gemini Embeddings
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-2
spring.ai.google.genai.embedding.text.options.task-type=RETRIEVAL_DOCUMENT
spring.ai.google.genai.embedding.text.options.dimensions=768

# PGVector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768