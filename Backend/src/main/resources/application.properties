spring.application.name=trustgate

# Load Backend/.env (git-ignored) so secrets never need to be hard-coded
# or manually exported. The file is optional: when absent, the defaults
# below (or real environment variables) are used.
spring.config.import=optional:file:.env[.properties]

# =========================================================
# PostgreSQL
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/trustgate
spring.datasource.username=${DB_USERNAME:ak}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# =========================================================
# Server
# =========================================================
server.port=8080

# =========================================================
# JWT
# =========================================================
# IMPORTANT: must be at least 32 bytes for HS256
# Default is a 64-char dev secret; override with JWT_SECRET in production
jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-in-production-0123456789abcdef}

# =========================================================
# Gemini
# =========================================================
# NOTE: Spring AI 2.0.1 Google GenAI auto-configuration asserts that
# project-id and location are non-empty even when using the public
# Gemini API (API-key mode), so we provide env-based defaults.
# Non-empty placeholder default: an empty key makes the GenAI ApiClient
# fall back to Google Application Default Credentials and crash startup.
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:unset-google-api-key}
spring.ai.google.genai.project-id=${GOOGLE_PROJECT_ID:controlplane-demo}
spring.ai.google.genai.location=${GOOGLE_LOCATION:global}

# =========================================================
# Gemini Embeddings
# =========================================================
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY:unset-google-api-key}
spring.ai.google.genai.embedding.project-id=${GOOGLE_PROJECT_ID:controlplane-demo}
spring.ai.google.genai.embedding.location=${GOOGLE_LOCATION:global}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-2
spring.ai.google.genai.embedding.text.options.task-type=RETRIEVAL_DOCUMENT
spring.ai.google.genai.embedding.text.options.dimensions=768

# =========================================================
# PGVector
# =========================================================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768

# =========================================================
# Logging
# =========================================================
logging.level.org.springframework.security=INFO